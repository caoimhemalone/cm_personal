name: CI

on:
  pull_request:
    branches: [develop, main, 'v.2']
  push:
    branches: [develop, main, 'v.2']

permissions:
  contents: read

jobs:
  quality-checks:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check lint
        run: npm run lint

      - name: Check build and TypeScript
        run: npm run build